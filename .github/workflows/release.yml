name: release

# 只在版本 tag（v1.1.1 形式）推送时构建，避免日常 push 烧 CI 分钟。
# 也可在 Actions 页手动触发做构建验证。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ''
          - name: Linux x64
            platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - name: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # 墨笺无 package.json / 无 npm 依赖，走纯 cargo 路线：
      # cargo install tauri-cli 只提供 cargo-tauri（无独立 tauri 可执行文件），
      # 因此 tauriScript 必须是 `cargo tauri`，由 action 拆成 bin=cargo + 参数 tauri。
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 无 Apple 证书：ad-hoc 签名（`-`），避免 Apple Silicon 下载后报「已损坏」。
          # 注意：这只是 ad-hoc，用户首次打开仍需在「隐私与安全性」里放行。
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tauriScript: cargo tauri
          tagName: v__VERSION__
          releaseName: 墨笺 v__VERSION__
          releaseBody: |
            墨笺 v__VERSION__ —— 本地多格式文档编辑器。

            - Windows：`.msi` 安装包 / 便携版 `.zip`（解压即用，无需安装）
            - Linux：`.deb` / `.AppImage`
            - macOS：`.dmg`（Apple Silicon 与 Intel 两个架构）

            macOS 未签名（ad-hoc），首次打开请在「系统设置 → 隐私与安全性」点「仍要打开」。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  # Windows 便携版：不依赖 MSI/NSIS 打包，单独 cargo build 出 exe 后压 ZIP。
  # needs: build + always()，保证 MSI 阶段万一失败也能拿到便携包。
  portable-windows:
    name: Windows portable (ZIP)
    runs-on: windows-latest
    needs: build
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build portable binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Pack portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $stage = "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "src-tauri/target/release/mojian.exe" -Destination $stage
          Copy-Item -Path "README.md","LICENSE" -Destination $stage
          @"
          墨笺 $version 便携版（Windows x64）

          - 解压后用 mojian.exe 启动，无需安装。
          - 前端已内置在 exe 中，配置保存在用户目录。
          - 需要 WebView2 运行时（Windows 11 自带；Win10 如缺失请安装 Microsoft Edge WebView2 Runtime）。
          "@ | Set-Content -Path "$stage/README-PORTABLE.txt" -Encoding utf8
          Compress-Archive -Path "$stage/*" -DestinationPath "mojian-portable-x64-$version.zip" -CompressionLevel Optimal

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: mojian-portable-x64
          path: mojian-portable-*.zip
          if-no-files-found: error

      - name: Upload portable ZIP to release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --json isDraft > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 尚未创建，跳过 Release 上传；ZIP 已作为 Actions 产物保留。"
            exit 0
          }
          gh release upload $tag "mojian-portable-x64-$version.zip" --clobber
