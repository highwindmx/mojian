[package]
name = "mojian"
version = "0.7.0"
description = "Tauri 2 富文本 / Markdown 编辑器"
authors = ["maokk"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mojian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
# EPUB 支持：zip 解压 + quick-xml 解析 OPF/container。
# zip 仅开 deflate（flate2 走纯 Rust 的 miniz_oxide 后端），零 C 依赖，符合离线自包含约定。
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

