<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨笺</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============================ 顶部应用栏 ============================ -->
  <header class="app-header">
    <div class="title-zone">
      <div class="file-path" id="file-path" title="">未打开文件</div>
    </div>
    <div class="header-actions">
      <button id="open-folder" class="header-btn" title="在文件管理器中打开当前文件所在位置" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span>打开位置</span>
      </button>
      <span class="hint">拖入文件 · 自动草稿 · Ctrl+S 保存</span>
    </div>
  </header>

  <!-- ============================ 顶部提示（Toast） ============================ -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ============================ 工具栏 ============================ -->
  <div class="toolbar" id="toolbar">
    <!-- 文件（最左） -->
    <div class="group">
      <button data-action="new" title="新建文档（HTML 或 Markdown）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      </button>
      <button data-action="open" title="打开 HTML / Markdown 文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      </button>
      <button data-action="save" title="保存（写回原文件）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
      <button data-action="saveas" title="另存为…">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="8 11 12 15 16 11"/><path d="M5 19h14"/></svg>
      </button>
      <button data-action="export" title="导出为自包含 HTML 文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 21V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><polyline points="9 13 12 16 15 13"/><line x1="12" y1="16" x2="12" y2="9"/></svg>
      </button>
      <button data-action="clear" title="清空草稿">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
    <div class="divider"></div>

    <!-- 历史：撤销/重做置于文本格式（加粗）左侧 -->
    <div class="group">
      <button data-action="undo" title="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      </button>
      <button data-action="redo" title="重做 (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
      </button>
    </div>
    <div class="divider"></div>

    <!-- 文本格式 -->
    <div class="group">
      <button data-cmd="bold" title="加粗 (Ctrl+B)" class="label-btn"><b>B</b></button>
      <button data-cmd="italic" title="斜体 (Ctrl+I)" class="label-btn"><i>I</i></button>
      <button data-cmd="underline" title="下划线 (Ctrl+U)" class="label-btn"><u>U</u></button>
      <button data-action="forecolor" title="文字颜色（选中文字后点击取色）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M12 4l-3.2 8h6.4L12 4z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button data-action="backcolor" title="背景颜色 / 高亮（选中文字后点击取色）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v4h6V3" fill="#fde68a" stroke="none"/></svg>
      </button>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button data-block="H1" title="标题 1" class="label-btn">H1</button>
      <button data-block="H2" title="标题 2" class="label-btn">H2</button>
      <button data-block="H3" title="标题 3" class="label-btn">H3</button>
      <button data-block="H4" title="标题 4" class="label-btn">H4</button>
      <button data-block="H5" title="标题 5" class="label-btn">H5</button>
      <button data-block="H6" title="标题 6" class="label-btn">H6</button>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button data-cmd="insertUnorderedList" title="无序列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>
      </button>
      <button data-cmd="insertOrderedList" title="有序列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="20" y2="6"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="10" y1="18" x2="20" y2="18"/><text x="2" y="8" font-size="7" fill="currentColor" stroke="none">1</text><text x="2" y="14" font-size="7" fill="currentColor" stroke="none">2</text><text x="2" y="20" font-size="7" fill="currentColor" stroke="none">3</text></svg>
      </button>
      <button data-block="BLOCKQUOTE" title="引用块">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h4v6H7v2H5V9a2 2 0 0 1 2-2zm8 0h4v6h-4v2h-2V9a2 2 0 0 1 2-2z" transform="scale(0.9) translate(1 1)"/></svg>
      </button>
      <button data-action="link" title="插入/编辑链接">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- 媒体与表格 -->
    <div class="group">
      <button data-action="image" title="插入图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5L5 20"/></svg>
      </button>
      <button data-action="table" title="插入表格 (3×3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
      </button>
      <button data-action="code" title="插入代码块">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 7 4 12 8 17"/><polyline points="16 7 20 12 16 17"/></svg>
      </button>
      <button data-action="hr" title="插入分割线">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- 缩放与源码 -->
    <div class="group source-keep">
      <button data-action="zoom-out" title="缩小 (Ctrl+-)">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button data-action="zoom-in" title="放大 (Ctrl+=)">+</button>
      <button data-action="source" title="切换源码 / 可视化编辑" class="label-btn">源码</button>
    </div>

    <!-- 隐藏取色器：点击文字/背景颜色按钮时由脚本调用其 .click() 弹出系统取色面板 -->
    <input type="color" id="fore-color-input" value="#e11d48" aria-hidden="true" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;border:0;padding:0;">
    <input type="color" id="back-color-input" value="#fde68a" aria-hidden="true" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;border:0;padding:0;">
  </div>

  <!-- ============================ 编辑区 ============================ -->
  <div class="editor-wrap">
    <div class="editor" id="editor" contenteditable="true"
         data-placeholder="在此输入内容，或把本地 .html / .md 文件拖进来…" spellcheck="false"></div>
    <textarea class="source-view" id="source-view" spellcheck="false"></textarea>
  </div>

  <!-- ============================ 状态栏 ============================ -->
  <div class="status-bar" id="status"></div>

  <!-- ============================ 链接对话框 ============================ -->
  <div class="modal hidden" id="link-dialog">
    <div class="modal-card">
      <h3>插入 / 编辑链接</h3>
      <label for="link-url">链接地址</label>
      <input type="text" id="link-url" placeholder="https://example.com" autocomplete="off">
      <div class="modal-actions">
        <button data-close>取消</button>
        <button class="primary" id="link-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- ============================ 图片对话框 ============================ -->
  <div class="modal hidden" id="image-dialog">
    <div class="modal-card">
      <h3>插入图片</h3>
      <label>上传本地图片（自动转为内嵌 base64）</label>
      <button type="button" class="file-pick" id="image-pick">选择本地图片…</button>
      <label for="image-url">或填写图片 URL</label>
      <input type="text" id="image-url" placeholder="https://example.com/img.png" autocomplete="off">
      <div class="modal-actions">
        <button data-close>取消</button>
        <button class="primary" id="image-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- ============================ 新建文档对话框 ============================ -->
  <div class="modal hidden" id="new-dialog">
    <div class="modal-card">
      <h3>新建文档</h3>
      <p class="modal-desc">请选择要创建的文档类型：</p>
      <div class="modal-actions">
        <button data-close>取消</button>
        <button id="new-md">Markdown (.md)</button>
        <button class="primary" id="new-html">HTML (.html)</button>
      </div>
    </div>
  </div>

  <!-- vendor 库（marked / turndown）离线自包含，须在 app.js 之前加载 -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/turndown.js"></script>
  <script src="app.js"></script>
</body>
</html>
