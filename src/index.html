<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨笺</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============================ 顶部应用栏 ============================ -->
  <header class="app-header">
    <div class="title-zone">
      <div class="file-path" id="file-path" title="">未打开文件</div>
    </div>
    <div class="header-actions">
      <button id="open-folder" class="header-btn" title="在文件管理器中打开当前文件所在位置" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span>打开位置</span>
      </button>
      <button id="toolbar-settings-btn" class="header-btn" title="自定义工具栏（显隐 / 排序）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>定制</span>
      </button>
      <select id="theme-select" class="header-select" title="切换主题">
        <option value="light">浅色</option>
        <option value="sepia">豆沙绿</option>
        <option value="yellow">养眼黄</option>
        <option value="dark">暗色</option>
      </select>
      <select id="encoding-select" class="header-select" title="文件编码（打开/保存）">
        <option value="">自动</option>
        <option value="utf-8">UTF-8</option>
        <option value="gbk">GBK</option>
      </select>
      <span class="hint">拖入文件 · 自动草稿 · Ctrl+S 保存</span>
    </div>
  </header>

  <!-- ============================ 顶部提示（Toast） ============================ -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ============================ 工具栏（由 app.js 依据配置动态渲染） ============================ -->
  <div class="toolbar" id="toolbar"><!-- 按钮 / 分组由 app.js 动态生成 --></div>

  <!-- ============================ 编辑区 ============================ -->
  <div class="editor-wrap" id="editor-wrap">
    <div class="editor" id="editor" contenteditable="true"
         data-placeholder="在此输入内容，或把本地 .html / .md 文件拖进来…" spellcheck="false"></div>
    <textarea class="source-view" id="source-view" spellcheck="false"></textarea>
  </div>

  <!-- ============================ 状态栏 ============================ -->
  <div class="status-bar" id="status"></div>

  <!-- ============================ 查找替换浮条 ============================ -->
  <div class="find-bar hidden" id="find-bar">
    <input type="text" id="find-input" placeholder="查找" autocomplete="off">
    <input type="text" id="replace-input" placeholder="替换为" autocomplete="off">
    <label title="区分大小写"><input type="checkbox" id="find-case"> 区分</label>
    <button id="find-prev" title="上一个">↑</button>
    <button id="find-next" title="下一个">↓</button>
    <button id="find-replace" title="替换当前">替换</button>
    <button id="find-replace-all" title="全部替换">全部</button>
    <button id="find-close" title="关闭">✕</button>
  </div>

  <!-- ============================ 链接对话框 ============================ -->
  <div class="modal hidden" id="link-dialog">
    <div class="modal-card">
      <h3>插入 / 编辑链接</h3>
      <label for="link-url">链接地址</label>
      <input type="text" id="link-url" placeholder="https://example.com" autocomplete="off">
      <div class="modal-actions">
        <button data-close>取消</button>
        <button class="primary" id="link-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- ============================ 图片对话框 ============================ -->
  <div class="modal hidden" id="image-dialog">
    <div class="modal-card">
      <h3>插入图片</h3>
      <label>上传本地图片（自动转为内嵌 base64）</label>
      <button type="button" class="file-pick" id="image-pick">选择本地图片…</button>
      <label for="image-url">或填写图片 URL</label>
      <input type="text" id="image-url" placeholder="https://example.com/img.png" autocomplete="off">
      <div class="modal-actions">
        <button data-close>取消</button>
        <button class="primary" id="image-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- ============================ 视频对话框 ============================ -->
  <div class="modal hidden" id="video-dialog">
    <div class="modal-card">
      <h3>插入视频</h3>
      <label>上传本地视频（自动转为内嵌 base64）</label>
      <button type="button" class="file-pick" id="video-pick">选择本地视频…</button>
      <label for="video-url">或填写视频链接 / 嵌入地址</label>
      <input type="text" id="video-url" placeholder="https://…/clip.mp4 或 嵌入页地址" autocomplete="off">
      <div class="modal-actions">
        <button data-close>取消</button>
        <button class="primary" id="video-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- ============================ 新建文档对话框 ============================ -->
  <div class="modal hidden" id="new-dialog">
    <div class="modal-card">
      <h3>新建文档</h3>
      <p class="modal-desc">请选择要创建的文档类型：</p>
      <div class="modal-actions">
        <button data-close>取消</button>
        <button id="new-md">Markdown (.md)</button>
        <button class="primary" id="new-html">HTML (.html)</button>
      </div>
    </div>
  </div>

  <!-- ============================ 工具栏自定义弹窗 ============================ -->
  <div class="modal hidden" id="toolbar-settings">
    <div class="modal-card">
      <h3>自定义工具栏</h3>
      <p class="modal-desc">勾选要显示的按钮；用 ↓/↑ 调整顺序。</p>
      <div class="toolbar-settings-list" id="toolbar-settings-list"></div>
      <div class="modal-actions">
        <button data-close>取消</button>
        <button id="toolbar-reset">恢复默认</button>
        <button class="primary" id="toolbar-settings-ok">完成</button>
      </div>
    </div>
  </div>

  <!-- 隐藏取色器：点击文字/背景颜色按钮时由脚本调用其 .click() 弹出系统取色面板（已移出工具栏，避免被动态渲染清空） -->
  <input type="color" id="fore-color-input" value="#e11d48" aria-hidden="true" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;border:0;padding:0;">
  <input type="color" id="back-color-input" value="#fde68a" aria-hidden="true" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;border:0;padding:0;">

  <!-- vendor 库（marked / turndown）离线自包含，须在 app.js 之前加载 -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/turndown.js"></script>
  <script src="app.js"></script>
</body>
</html>
