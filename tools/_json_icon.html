<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Fixed 1024px design; screenshot at --window-size=1024,1024. */
  html, body { margin: 0; padding: 0; overflow: hidden; width: 1024px; height: 1024px; }
  .icon {
    position: absolute; left: 0; top: 0;
    width: 1024px; height: 1024px;
    background: #F0AF0A;
    border-radius: 230px;   /* 22.5% */
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
  }
  .glyph {
    font-family: "KaiTi", "STKaiti", "SimKai", serif;
    color: #fff;
    font-size: 740px;
    line-height: 1;
    transform: translateY(2%);
    user-select: none;
  }
</style>
</head>
<body>
  <div class="icon"><span class="glyph">墨</span></div>
</body>
</html>
